name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      # all three repositories, checked out as siblings
      # (e2e/go.mod uses a replace directive pointing at ../../wormhole-william,
      #  and the suite builds the mailbox-server from ../../wormhole-mailbox)
      - uses: actions/checkout@v4
        with:
          path: wormhole-relay
      - uses: actions/checkout@v4
        with:
          repository: dougsko/wormhole-mailbox
          path: wormhole-mailbox
      - uses: actions/checkout@v4
        with:
          repository: dougsko/wormhole-william
          path: wormhole-william
      - uses: actions/setup-go@v5
        with:
          # wormhole-mailbox/go.mod declares the highest go directive
          # (go 1.26.8); the suite builds the sibling mailbox-server from
          # source inside the tests, so install at least that version and
          # avoid a surprise toolchain download mid-test
          go-version-file: wormhole-mailbox/go.mod
          cache: true
          cache-dependency-path: |
            wormhole-relay/go.sum
            wormhole-relay/e2e/go.sum
            wormhole-mailbox/go.sum
            wormhole-william/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install magic-wormhole
      - working-directory: wormhole-relay/e2e
        env:
          WORMHOLE_E2E_REQUIRE: '1'
        run: go test -tags=e2e -v -count=1 -timeout 300s .

  image:
    needs: [test, e2e]
    # only publish on pushes (not on PRs); the image is pushed as linux/amd64 and linux/arm64
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
